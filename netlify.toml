# netlify.toml — Netlify configuration for ATE
# Proxies third-party APIs with header overrides to bypass browser CORS and 406 blocks.

[[redirects]]
  from = "/api/overpass/*"
  to = "https://overpass-api.de/api/:splat"
  status = 200
  force = true
  headers = { Origin = "https://overpass-api.de", Referer = "https://overpass-api.de/api/interpreter" }

[[redirects]]
  from = "/api/overpass-kumi/*"
  to = "https://overpass.kumi.systems/api/:splat"
  status = 200
  force = true
  headers = { Origin = "https://overpass.kumi.systems", Referer = "https://overpass.kumi.systems/api/interpreter" }

[[redirects]]
  from = "/api/osrm/*"
  to = "https://router.project-osrm.org/:splat"
  status = 200
  force = true
  headers = { Origin = "https://router.project-osrm.org", Referer = "https://router.project-osrm.org" }
